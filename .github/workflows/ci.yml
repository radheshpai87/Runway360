name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Lint checks
      run: npm run lint

    - name: TypeScript compilation check
      run: npx tsc --noEmit

    - name: Build check
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://fwzhbehaqzpnkvolodxs.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-key"
        NEXTAUTH_SECRET: "mock-secret"
        NEXTAUTH_URL: "http://localhost:3000"

    - name: Run tests
      run: npm run test:ci
